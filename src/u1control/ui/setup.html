<!doctype html>
<html><head><meta charset="utf-8"><title>U1 print setup</title>
<style>
:root{--bg:var(--orca-bg,#fff);--fg:var(--orca-fg,#222);--mut:var(--orca-muted,#777);--acc:var(--orca-accent,#009688);
--accfg:var(--orca-accent-fg,#fff);--bd:var(--orca-border,#ddd);--warn:#e08a00}
*{box-sizing:border-box}body{margin:0;padding:14px 16px;background:var(--bg);color:var(--fg);font:13px var(--orca-font,system-ui,sans-serif)}
.job{display:flex;gap:12px;align-items:center;margin-bottom:12px}.job img{width:84px;height:84px;object-fit:contain;border:1px solid var(--bd);border-radius:8px}
.job h1{font-size:15px;margin:0 0 4px}.mut{color:var(--mut)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd)}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--bd);flex:none}
.fil{min-width:150px}.heads{display:flex;gap:6px;flex-wrap:wrap}
.head{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--fg);cursor:pointer;font:inherit}
.head.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.head.empty{opacity:.55}
.warn{color:var(--warn);font-size:12px;margin:6px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}.opts label{display:flex;gap:6px;align-items:center}
select{font:inherit}
.bar{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
button.p{background:var(--acc);color:var(--accfg);border:0;border-radius:6px;padding:7px 16px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
</style></head>
<body>
<div class="job"><img id="thumb" alt="" hidden><div><h1 id="name"></h1><div class="mut" id="meta"></div></div></div>
<h2>Filament → toolhead</h2><div id="rows"></div><div id="warns"></div>
<h2>Print options</h2><div class="opts" id="opts"></div>
<h2>Top cover</h2>
<label>Mode <select id="purifier">
<option value="auto">Auto</option><option value="strong">Strong cooling</option><option value="weak">Weak cooling</option>
<option value="keep-warm">Keep warm</option><option value="off">Leave as sliced</option></select></label>
<span class="mut" id="autoPur"></span>
<div class="bar"><button class="s" id="cancel">Cancel</button><button class="p" id="send">Send to U1</button></div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
let heads = D.heads, map = Object.assign({}, D.map), touched = new Set();
const fam = t => ((t || "").match(/[A-Za-z]+/) || [""])[0].toUpperCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const j = D.job;
$("name").textContent = j.name || "Print";
$("meta").textContent = [j.time, j.weight && (j.weight + " g"), j.plate, "→ " + j.address].filter(Boolean).join(" · ");
if (j.thumbnail) { $("thumb").src = "data:image/png;base64," + j.thumbnail; $("thumb").hidden = false; }
const PUR = {strong:"strong cooling", weak:"weak cooling", "keep-warm":"keep warm"};
$("purifier").value = D.purifier; $("autoPur").textContent = " Auto picks: " + PUR[D.auto_purifier];

function render() {
  $("rows").innerHTML = D.filaments.map(f => {
    const btns = heads.map(h => `<button class="head ${map[f.index] == h.index ? "on" : ""} ${h.loaded ? "" : "empty"}"
      data-f="${f.index}" data-t="${h.index}" title="${esc(h.vendor)} ${esc(h.sub_type)}">
      <span class="sw" style="background:${h.colour || "transparent"}"></span>T${h.index + 1} ${esc(h.loaded ? h.type : "empty")}</button>`).join("");
    return `<div class="row"><span class="sw" style="background:${f.colour || "#ccc"}"></span>
      <span class="fil">Filament ${f.index + 1} · ${esc(f.type)}${f.weight ? ` <span class="mut">${f.weight} g</span>` : ""}</span>
      <div class="heads">${btns}</div></div>`;
  }).join("");
  const w = [];
  for (const f of D.filaments) {
    const h = heads[map[f.index]];
    if (!h) continue;
    if (!h.loaded) w.push(`Filament ${f.index + 1} → T${h.index + 1}: toolhead is empty`);
    else if (fam(h.type) !== fam(f.type)) w.push(`Filament ${f.index + 1} is ${esc(f.type)} but T${h.index + 1} has ${esc(h.type)}`);
  }
  $("warns").innerHTML = w.map(x => `<div class="warn">⚠ ${x}</div>`).join("");
}
$("rows").addEventListener("click", e => {
  const b = e.target.closest("button.head"); if (!b) return;
  map[b.dataset.f] = +b.dataset.t; touched.add(b.dataset.f); render();
});
$("opts").innerHTML = Object.keys(D.prefs).map(k =>
  `<label><input type="checkbox" data-k="${k}" ${D.prefs[k] ? "checked" : ""}> ${esc(D.labels[k] || k)}</label>`).join("");
const prefs = () => Object.fromEntries([...document.querySelectorAll("#opts input")].map(i => [i.dataset.k, i.checked]));
$("send").onclick = () => orca.submit({map, prefs: prefs(), purifier: $("purifier").value});
$("cancel").onclick = () => orca.submit({cancelled: true});
document.addEventListener("keydown", e => { if (e.key === "Escape") orca.submit({cancelled: true}); });
orca.onMessage(m => {   // live toolhead refresh: a spool changed on the touchscreen shows up here
  if (!m || !m.heads) return;
  heads = m.heads;
  for (const [f, t] of Object.entries(m.map || {})) if (!touched.has(f)) map[f] = t;
  render();
});
render();
orca.postMessage({ready: true});
setInterval(() => orca.postMessage({refresh: true}), 3000);
</script></body></html>
