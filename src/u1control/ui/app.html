        font-feature-settings: inherit;
        font-variation-settings: inherit;
        letter-spacing: inherit;
        color: inherit;
        opacity: 1;
    }

    :where(textarea:is([data-scope], [data-pc-section])) {
        resize: vertical;
    }

    :where(:is([data-scope], [data-pc-section]))::placeholder {

    }

    :where(:is([data-scope], [data-pc-section]))::-webkit-datetime-edit {

    :where(:is([data-scope], [data-pc-section]))::-webkit-datetime-edit-fields-wrapper {

    :where(:-moz-ui-invalid:is([data-scope], [data-pc-section])) {

    }

    :where(ol:is([data-scope], [data-pc-section])),
    :where(menu:is([data-scope], [data-pc-section])) {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    :where(table:is([data-scope], [data-pc-section])) {
        border-collapse: collapse;
        border-color: inherit;
        text-indent: 0;
    }

    :where(caption:is([data-scope], [data-pc-section])),
    :where(th:is([data-scope], [data-pc-section])),
    :where(td:is([data-scope], [data-pc-section])) {
        text-align: inherit;
        font-weight: inherit;
        padding: 0;

    :where(h1:is([data-scope], [data-pc-section])),

    :where(h3:is([data-scope], [data-pc-section])),
    :where(h4:is([data-scope], [data-pc-section])),
    :where(h5:is([data-scope], [data-pc-section])),
    :where(h6:is([data-scope], [data-pc-section])),
    :where(p:is([data-scope], [data-pc-section])),
    :where(figure:is([data-scope], [data-pc-section])),
    :where(blockquote:is([data-scope], [data-pc-section])),
    :where(dl:is([data-scope], [data-pc-section])),
    :where(dd:is([data-scope], [data-pc-section])) {

        font-weight: inherit;
        margin: 0;
    }

    :where(a:is([data-scope], [data-pc-section])) {

        outline: auto;
    }

`,xf=`
    *,
    ::before,
    ::after {
        box-sizing: border-box;
    }

    .p-component {
        font-family: dt('typography.font.family');
        font-feature-settings: inherit;
        line-height: dt('typography.line.height');
    }

    .p-collapsible-enter-active {
        animation: p-animate-collapsible-expand 0.2s ease-out;
        overflow: hidden;
    }

    .p-collapsible-leave-active {
        animation: p-animate-collapsible-collapse 0.2s ease-out;
        overflow: hidden;
    }

    @keyframes p-animate-collapsible-expand {
        from {
            grid-template-rows: 0fr;
        }
        to {
            grid-template-rows: 1fr;
        }
    }

    @keyframes p-animate-collapsible-collapse {
        from {
            grid-template-rows: 1fr;
        }
        to {
            grid-template-rows: 0fr;
        }
    }

    .p-disabled,
    .p-disabled * {
        cursor: default;
        pointer-events: none;
        user-select: none;
    }

    .p-disabled,
    .p-component:disabled {
        opacity: dt('disabled.opacity');
    }

    .pi {
        font-size: dt('icon.size');
    }

    .p-icon {
        width: var(--px-icon-size, dt('icon.size'));
        height: var(--px-icon-size, dt('icon.size'));
        flex-shrink: 0;
    }

    .p-icon-spin {
        -webkit-animation: p-icon-spin 2s infinite linear;
        animation: p-icon-spin 2s infinite linear;
    }

    @-webkit-keyframes p-icon-spin {
        0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
        }
        100% {
            -webkit-transform: rotate(359deg);
            transform: rotate(359deg);
        }
    }

    @keyframes p-icon-spin {
        0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
        }
        100% {
            -webkit-transform: rotate(359deg);
            transform: rotate(359deg);
        }
    }

    .p-overlay-mask {
        background: var(--px-mask-background, dt('mask.background'));
        color: dt('mask.color');
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .p-overlay-mask-enter-active {
        animation: p-animate-overlay-mask-enter dt('mask.transition.duration') forwards;
    }

    .p-overlay-mask-leave-active {
        animation: p-animate-overlay-mask-leave dt('mask.transition.duration') forwards;
    }

    @keyframes p-animate-overlay-mask-enter {
        from {
            background: transparent;
        }
        to {
            background: var(--px-mask-background, dt('mask.background'));
        }
    }
    @keyframes p-animate-overlay-mask-leave {
        from {
            background: var(--px-mask-background, dt('mask.background'));
        }
        to {
            background: transparent;
        }
    }

    .p-anchored-overlay-enter-active {
        animation: p-animate-anchored-overlay-enter 300ms cubic-bezier(.19,1,.22,1);
    }

    .p-anchored-overlay-leave-active {
        animation: p-animate-anchored-overlay-leave 300ms cubic-bezier(.19,1,.22,1);
        pointer-events: none;
    }

    @keyframes p-animate-anchored-overlay-enter {
        from {
            opacity: 0;
            transform: scale(0.93);
        }
    }

    @keyframes p-animate-anchored-overlay-leave {
        to {
            opacity: 0;
            transform: scale(0.93);

 Druckoptionen nicht gemeldet hat. Sonst wird der Druck mit den Werkzeugköpfen gesendet, die U1 Control nach Material und Farbe zugeordnet hat. Um die Werkzeugköpfe jedes Mal zu wählen, wechseln Sie zu Experte und stellen Sie das Fenster der Druckvorbereitung auf immer.`,"ps.dialog.always":`Das Fenster öffnet sich bei jedem an den U1 gesendeten Druck.`,"ps.dialog.never":`Das Fenster öffnet sich nie: Drucke werden mit den zugeordneten Werkzeugköpfen gesendet, und ein Druck mit leerem Werkzeugkopf oder anderem Material wird abgelehnt.`,"ps.how":`Sie läuft, wenn OrcaSlicer den Druck über den Druck-Host des U1 sendet (Drucken oder Senden in OrcaSlicer). Sie läuft nicht bei „Exportiere G-Code“, bei Drucken auf der Seite Dateien von U1 Control und auch nicht, wenn in den Einstellungen von OrcaSlicer die Option „Drucker-Agenten anstelle von Druck-Hosts verwenden“ eingeschaltet ist.`,"ps.agent":`Mit den Drucker-Agenten von OrcaSlicer wählen Sie stattdessen U1 Control als Agenten: Schalten Sie in den Einstellungen von OrcaSlicer „Drucker-Agenten anstelle von Druck-Hosts verwenden“ ein und setzen Sie dann den Drucker-Agent des U1-Druckerprofils auf u1control. Der Druckdialog von OrcaSlicer wählt dann die Werkzeugköpfe (ein Platz je Werkzeugkopf, mit seiner Farbe), und U1 Control sendet sie mit denselben G-Code-Korrekturen. Die Kästchen für automatische Bett-Nivellierung, dynamische Flusskalibrierung und Zeitraffer im Dialog sind anfangs angekreuzt: Eine Option läuft nur, wenn ihr Kästchen angekreuzt ist und sie in den Druckoptionen von U1 Control eingeschaltet ist; das Entfernen des Häkchens schaltet sie also aus. OrcaSlicer merkt sich das Kästchen; kreuzen Sie es wieder an, um zur Einstellung von U1 Control zurückzukehren.`,"mode.unsaved":`Ungespeicherte Änderungen`,"mode.saving":`Wird gespeichert…`,"mode.notLoaded":`Warten auf die Einstellungen von U1 Control…`,"mode.on":`an`,"mode.off":`aus`,"settings.savedBut":`Gespeichert, aber: {error}`,"settings.notSaved":`Nicht gespei
