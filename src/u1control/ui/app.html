        letter-spacing: inherit;
        color: inherit;
        text-align: inherit;

        padding: 0;

        font: inherit;
        font-feature-settings: inherit;
        font-variation-settings: inherit;
        letter-spacing: inherit;
        color: inherit;
        opacity: 1;
    }

    :where(textarea:is([data-scope], [data-pc-section])) {
        resize: vertical;
    }

    :where(:is([data-scope], [data-pc-section]))::placeholder {

        color: color-mix(in oklab, currentcolor 50%, transparent);
    }

    :where(:is([data-scope], [data-pc-section]))::-webkit-inner-spin-button,
    :where(:is([data-scope], [data-pc-section]))::-webkit-outer-spin-button {
        height: auto;
    }

    :where(:is([data-scope], [data-pc-section]))::-webkit-search-decoration {
        -webkit-appearance: none;
    }

    :where(:is([data-scope], [data-pc-section]))::-webkit-datetime-edit {
        display: inline-flex;
    }

    :where(:is([data-scope], [data-pc-section]))::-webkit-datetime-edit-fields-wrapper {
        padding: 0;
    }

    :where(:-moz-ui-invalid:is([data-scope], [data-pc-section])) {
        box-shadow: none;
    }

    :where(ul:is([data-scope], [data-pc-section])),
    :where(ol:is([data-scope], [data-pc-section])),
    :where(menu:is([data-scope], [data-pc-section])) {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    :where(table:is([data-scope], [data-pc-section])) {
        border-collapse: collapse;
        border-color: inherit;
        text-indent: 0;
    }

    :where(caption:is([data-scope], [data-pc-section])),
    :where(th:is([data-scope], [data-pc-section])),
    :where(td:is([data-scope], [data-pc-section])) {
        text-align: inherit;
        font-weight: inherit;
        padding: 0;
    }

    :where(h1:is([data-scope], [data-pc-section])),
    :where(h2:is([data-scope], [data-pc-section])),
    :where(h3:is([data-scope], [data-pc-section])),
    :where(h4:is([data-scope], [data-pc-section])),
    :where(h5:is([data-scope], [data-pc-section])),
    :where(h6:is([data-scope], [data-pc-section])),
    :where(p:is([data-scope], [data-pc-section])),
    :where(figure:is([data-scope], [data-pc-section])),
    :where(blockquote:is([data-scope], [data-pc-section])),
    :where(dl:is([data-scope], [data-pc-section])),
    :where(dd:is([data-scope], [data-pc-section])) {
        font-size: inherit;
        font-weight: inherit;
        margin: 0;
    }

    :where(a:is([data-scope], [data-pc-section])) {
        color: inherit;
        -webkit-text-decoration: inherit;
        text-decoration: inherit;
    }

    :where(fieldset:is([data-scope], [data-pc-section])),
    :where(legend:is([data-scope], [data-pc-section])) {
        border: 0 solid;
        margin: 0;
        padding: 0;
    }

    :where(video:is([data-scope], [data-pc-section])),
    :where(canvas:is([data-scope], [data-pc-section])),
    :where(iframe:is([data-scope], [data-pc-section])),
    :where(embed:is([data-scope], [data-pc-section])),
    :where(object:is([data-scope], [data-pc-section])) {
        display: block;
        vertical-align: middle;
    }

    :where(img:is([data-scope], [data-pc-section])),
    :where(video:is([data-scope], [data-pc-section])) {
        max-width: 100%;
    }

    :where(img:is([data-scope], [data-pc-section]):not([height])),
    :where(video:is([data-scope], [data-pc-section]):not([height])) {
        height: auto;
    }

    :where(hr:is([data-scope], [data-pc-section])) {
        height: 0;
        color: inherit;
        border-top-width: 1px;
    }

    :where(summary:is([data-scope], [data-pc-section])) {
        display: list-item;
    }

    :where(dialog:is([data-scope], [data-pc-section])) {
        border: 0 solid;
        padding: 0;
        margin: 0;
        max-width: none;
        max-height: none;

        color: inherit;
    }

    :where(:-moz-focusring:is([data-scope], [data-pc-section])) {
        outline: auto;
    }

    *,
    ::before,
    ::after {
        box-sizing: border-box;
    }

        font-family: dt('typography.font.family');

        line-height: dt('typography.line.height');
    }

        animation: p-animate-collapsible-expand 0.2s ease-out;
        overflow: hidden;
    }

    .p-collapsible-leave-active {
        animation: p-animate-collapsible-collapse 0.2s ease-out;
        overflow: hidden;
    }

    @keyframes p-animate-collapsible-expand {
        from {
            grid-template-rows: 0fr;
        }
        to {
            grid-template-rows: 1fr;
        }
    }

    @keyframes p-animate-collapsible-collapse {
        from {
            grid-template-rows: 1fr;
        }
        to {
            grid-template-rows: 0fr;
        }
    }

        cursor: default;
        pointer-events: none;
        user-select: none;
    }

        opacity: dt('disabled.opacity');
    }

        font-size: dt('icon.size');
    }

        height: var(--px-icon-size, dt('icon.size'));
        flex-shrink: 0;
    }

    .p-icon-spin {
        -webkit-animation: p-icon-spin 2s infinite linear;
        animation: p-icon-spin 2s infinite linear;
    }

    @-webkit-keyframes p-icon-spin {
        0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
        }
        100% {
            -webkit-transform: rotate(359deg);
            transform: rotate(359deg);
        }
    }

    @keyframes p-icon-spin {
        0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
        }
        100% {
            -webkit-transform: rotate(359deg);

        }

        color: dt('mask.color');
        position: fixed;

        left: 0;
        width: 100%;
        height: 100%;

        animation: p-animate-overlay-mask-enter dt('mask.transition.duration') forwards;
    }

    .p-overlay-mask-leave-active {
        animation: p-animate-overlay-mask-leave dt('mask.transition.duration') forwards;
    }

    @keyframes p-animate-overlay-mask-enter {
        from {
            background: transparent;
        }
        to {
            background: var(--px-mask-background, dt('mask.background'));
        }
    }
    @keyframes p-animate-overlay-mask-leave {
        from {
            background: var(--px-mask-background, dt('mask.background'));
        }
        to {
            background: transparent;
        }
    }

    }

    @keyframes p-animate-anchored-overlay-leave {
        to {
            opacity: 0;
            transform: scale(0.93);
        }

            border-color dt('inputnumber.transition.duration'),

    }

    .p-inputnumber-button:disabled {
        cursor: auto;
    }

    .p-inputnumber-button:not(:disabled):hover {
        background: dt('inputnumber.button.hover.background');
        color: dt('inputnumber.button.hover.color');
    }

    .p-inputnumber-button:not(:disabled):active {

        color: dt('inputnumber.button.active.color');

    .p-inputnumber-stacked .p-inputnumber-button {

        flex: 1 1 auto;
