name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Spooler (the other OrcaSlicer plugin) for tests/test_spooler_joint.py.
      # Spooler (>= 0.10.0) for the joint integration test.
      - uses: actions/checkout@v7
        with:
          repository: bloodf/spooler
          ref: main
          path: spooler
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the plugin
        run: python scripts/build.py
      - name: Unit tests
        env:
          SPOOLER_SRC: ${{ github.workspace }}/spooler
        run: python -m unittest discover -s tests
