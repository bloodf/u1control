name: Publish to Orca Cloud

# Publishing a GitHub release publishes that version to Orca Cloud.
# One-time setup: connect this repository on Orca Cloud (Edit plugin > GitHub publishing).
# No secrets: the run proves its origin with a short-lived GitHub OIDC token.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build (tag must match pyproject version)
        run: python scripts/build.py --release-tag "$TAG"
      - name: Changelog section for this version
        run: |
          awk -v v="${TAG#v}" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
      - name: Publish to Orca Cloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          metadata="$(jq -cn --arg version "${TAG#v}" --rawfile changelog notes.md \
            '{version: $version, changelog: ($changelog | .[0:4000])}')"
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            --form-string "metadata=$metadata" -F "files=@dist/u1control_any.py" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json; echo
          if [ "$status" != "201" ]; then
            echo "::error::Orca Cloud returned HTTP $status"
            exit 1
          fi
